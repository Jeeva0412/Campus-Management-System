services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - "8080:8000"
    env_file:
      - .env
    depends_on:
      - db
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
