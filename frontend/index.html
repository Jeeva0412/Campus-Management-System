<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexusClubs - Campus Pass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[var(--color-ink)] text-[var(--color-paper)] font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var errDiv = document.createElement('div');
        errDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:red;color:white;padding:20px;z-index:9999;font-family:monospace;white-space:pre-wrap;overflow:auto;';
        errDiv.innerText = 'Runtime Error: ' + msg + '\n\n' + (error ? error.stack : '');
        document.body.appendChild(errDiv);
      };
      window.addEventListener('unhandledrejection', function(event) {
        var errDiv = document.createElement('div');
        errDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:red;color:white;padding:20px;z-index:9999;font-family:monospace;white-space:pre-wrap;overflow:auto;';
        errDiv.innerText = 'Unhandled Rejection: ' + event.reason;
        document.body.appendChild(errDiv);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
